<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LSTC AI 茶飲推薦</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      background: linear-gradient(135deg, #fdfbf7 0%, #f3e7e9 50%, #e3eeff 100%);
      color: #2c3e35;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      min-height: 100vh;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
    }

    .panel {
      padding: 36px 28px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* 頁面切換控制 */
    .page-section {
      display: none;
      animation: fadeIn 0.35s ease-out;
    }

    .page-section.active-page {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2 {
      margin: 0 0 10px;
      color: #1e293b;
    }

    h1 {
      background: linear-gradient(135deg, #2e5a3c, #1d4ed8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: clamp(2rem, 5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .intro {
      color: #5c6b61;
      line-height: 1.7;
      margin-bottom: 28px;
      font-size: 1.05rem;
    }

    label {
      display: block;
      margin: 24px 0 14px;
      font-weight: 700;
      color: #2c3e50;
      font-size: 1.1rem;
    }

    /* 雙向動態飄浮按鈕區域 (上下左右移動) */
    .mood-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
      padding: 12px 10px;
    }

    .mood-btn {
      padding: 12px 18px;
      border: 2px solid transparent;
      border-radius: 50px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
    }

    .mood-btn:nth-child(1)  { animation: float2D1 4s ease-in-out infinite; }
    .mood-btn:nth-child(2)  { animation: float2D2 3.6s ease-in-out infinite 0.3s; }
    .mood-btn:nth-child(3)  { animation: float2D3 4.2s ease-in-out infinite 0.6s; }
    .mood-btn:nth-child(4)  { animation: float2D4 3.8s ease-in-out infinite 0.9s; }
    .mood-btn:nth-child(5)  { animation: float2D5 4.5s ease-in-out infinite 0.2s; }
    .mood-btn:nth-child(6)  { animation: float2D1 4.1s ease-in-out infinite 0.4s; }
    .mood-btn:nth-child(7)  { animation: float2D2 3.7s ease-in-out infinite 0.7s; }
    .mood-btn:nth-child(8)  { animation: float2D3 4.3s ease-in-out infinite 1s; }
    .mood-btn:nth-child(9)  { animation: float2D4 3.9s ease-in-out infinite 0.5s; }
    .mood-btn:nth-child(10) { animation: float2D5 4.4s ease-in-out infinite 0.8s; }
    .mood-btn:nth-child(11) { animation: float2D1 3.5s ease-in-out infinite 1.1s; }
    .mood-btn:nth-child(12) { animation: float2D2 4s ease-in-out infinite 0.1s; }

    @keyframes float2D1 {
      0%, 100% { transform: translate(0px, 0px); }
      25%      { transform: translate(5px, -8px); }
      50%      { transform: translate(-4px, -4px); }
      75%      { transform: translate(-6px, 6px); }
    }

    @keyframes float2D2 {
      0%, 100% { transform: translate(0px, 0px); }
      25%      { transform: translate(-6px, -6px); }
      50%      { transform: translate(4px, -10px); }
      75%      { transform: translate(6px, 4px); }
    }

    @keyframes float2D3 {
      0%, 100% { transform: translate(0px, 0px); }
      25%      { transform: translate(7px, 5px); }
      50%      { transform: translate(-5px, -8px); }
      75%      { transform: translate(-3px, 7px); }
    }

    @keyframes float2D4 {
      0%, 100% { transform: translate(0px, 0px); }
      25%      { transform: translate(-8px, -4px); }
      50%      { transform: translate(6px, 6px); }
      75%      { transform: translate(3px, -9px); }
    }

    @keyframes float2D5 {
      0%, 100% { transform: translate(0px, 0px); }
      25%      { transform: translate(6px, -7px); }
      50%      { transform: translate(-7px, 5px); }
      75%      { transform: translate(-2px, -6px); }
    }

    /* 12 個狀態按鈕顏色 */
    .mood-btn[data-mood="開心"] { background: #fef3c7; color: #b45309; border-color: #fde68a; }
    .mood-btn[data-mood="放鬆"] { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
    .mood-btn[data-mood="靈感"] { background: #f3e8ff; color: #7e22ce; border-color: #e9d5ff; }
    .mood-btn[data-mood="清爽"] { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
    .mood-btn[data-mood="專注"] { background: #e0e7ff; color: #4338ca; border-color: #c7d2fe; }
    .mood-btn[data-mood="活力"] { background: #ffedd5; color: #c2410c; border-color: #fed7aa; }
    .mood-btn[data-mood="失眠"] { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .mood-btn[data-mood="焦慮"] { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
    .mood-btn[data-mood="眼乾"] { background: #ecfeff; color: #0e7490; border-color: #a5f3fc; }
    .mood-btn[data-mood="鬱悶"] { background: #fce7f3; color: #be185d; border-color: #fbcfe8; }
    .mood-btn[data-mood="暴躁"] { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .mood-btn[data-mood="分心"] { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }

    .mood-btn:hover {
      filter: brightness(0.95);
      animation-play-state: paused;
    }

    .hint {
      color: #64748b;
      background: #f8fafc;
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      border: 2px dashed #cbd5e1;
      font-size: 1rem;
      margin-top: 28px;
    }

    /* 卡片與圖表樣式 */
    .tea-header {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (min-width: 600px) {
      .tea-header {
        flex-direction: row;
        align-items: center;
      }
    }

    .tea-image-container {
      flex-shrink: 0;
      width: 100%;
      height: 180px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
      background-color: #f1f5f9;
    }

    @media (min-width: 600px) {
      .tea-image-container {
        width: 180px;
        height: 140px;
      }
    }

    .tea-image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f8fafc;
    }

    .tea-title-area h2 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .tea-title-area p {
      margin: 4px 0;
      color: #64748b;
      font-size: 0.95rem;
    }

    .infographics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    @media (min-width: 500px) {
      .infographics-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .info-badge {
      background: #f1f5f9;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .info-badge .icon {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .info-badge .label {
      font-size: 0.75rem;
      color: #64748b;
      display: block;
      margin-bottom: 2px;
    }

    .info-badge .value {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
    }

    .recipe-box {
      background: #fdf4f0;
      border-left: 4px solid #f97316;
      padding: 14px 18px;
      border-radius: 0 12px 12px 0;
      margin-top: 16px;
    }

    .recipe-box p {
      margin: 0;
      color: #9a3412;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* 優化後的精美鼓勵語樣式 */
    .encourage-box {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border-left: 5px solid #16a34a;
      padding: 18px 22px;
      border-radius: 0 16px 16px 0;
      margin-top: 16px;
      box-shadow: 0 4px 15px rgba(22, 163, 74, 0.08);
    }

    .encourage-box p {
      margin: 0;
      color: #166534;
      font-size: 1.08rem;
      line-height: 1.8;
      font-weight: 500;
      font-family: "Noto Serif TC", "Songti TC", "Microsoft JhengHei", serif;
      letter-spacing: 0.8px;
    }

    .notice {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      color: #94a3b8;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    /* 按鈕樣式 (頁面導航) */
    .nav-btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-recipe {
      background: #f97316;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
    }

    .btn-recipe:hover {
      background: #ea580c;
    }

    .btn-back {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-back:hover {
      background: #cbd5e1;
    }

    .btn-home {
      background: #1e293b;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2);
    }

    .btn-home:hover {
      background: #0f172a;
    }
  </style>
</head>

        <div id="page2Content"></div>

        <div class="nav-btn-group">
          <button type="button" class="action-btn btn-recipe" onclick="goToPage(3)">💬 查看鼓勵語</button>
          <button type="button" class="action-btn btn-back" onclick="goToPage(1)">⬅️ 返回上一頁</button>
        </div>
      </div>

      <!-- Page 3: 鼓勵語 -->
      <div id="page3" class="page-section">
        <h2 style="font-size: 1.5rem; margin-bottom: 20px;" id="page3Title">🌿 療癒指南</h2>
        <div id="page3Content"></div>

        <div class="nav-btn-group">
          <button type="button" class="action-btn btn-back" onclick="goToPage(2)">⬅️ 返回上一頁</button>
          <button type="button" class="action-btn btn-home" onclick="goToPage(1)">🏠 回到首頁</button>

      </div>

    </section>
  </main>
